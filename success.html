<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(155deg, #e90ecc, #95f714e8);
            font-family: Arial, Helvetica, sans-serif;
        }

        .success-box {
            background: #fff;
            padding: 40px 45px;
            width: 360px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .check {
            width: 80px;
            height: 80px;
            background-color: #36ed39;
            color: #fff;
            font-size: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }

        h2 {
            margin-bottom: 10px;
            color: #333;
        }

        p {
            font-size: 15px;
            color: #666;
            margin-bottom: 25px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 20px;
            background-color: #00a9a9;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #008f8f;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="success-box">
        <div class="check">✔</div>
        <h2>Successfully Submitted!</h2>
        <p>Your form has been submitted successfully.<br>
            We will contact you soon.</p>
        <button onclick="window.location.href='form.html'">
            Go Back
        </button>
    </div>

</body>

</html>
